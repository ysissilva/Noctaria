<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>NOCTÁRIA — A Academia das Mil Portas</title>
    <meta name="description" content="Um jogo narrativo de fantasia gótica, exploração e mistérios sobrenaturais na Academia de Noctária." />
    <!-- Google Fonts for Gothic Aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/styles/main.css">
  </head>
  <body>
    <div id="app">
      <!-- Cursor customizado de investigacao -->
      <div id="custom-cursor">
        <div class="cursor-ring"></div>
        <div class="cursor-dot"></div>
        <div class="cursor-inspect-icon" id="cursor-icon">🔍</div>
      </div>
      <!-- Ambient Fog / Atmosphere overlay -->
      <div class="ambient-fog"></div>

      <!-- Aviso para girar o celular para o modo horizontal (paisagem) -->
      <div id="mobile-rotate-overlay" class="mobile-rotate-overlay">
        <div class="mobile-rotate-box">
          <div class="mobile-rotate-icon">📱↻</div>
          <h2 class="mobile-rotate-title">Gire o Dispositivo</h2>
          <p class="mobile-rotate-desc">Para explorar Noctária, posicione seu celular na <strong>horizontal (modo paisagem)</strong>.</p>
        </div>
      </div>

      <!-- Notifications container -->
      <div id="notifications" class="notification-container"></div>

      <!-- Main Game Container managed by JavaScript -->
      <div id="game-root"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
